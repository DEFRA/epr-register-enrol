# Root Docker Compose stack for the EPR Register Case Management PoC.
# Brings up both services (frontend + backend) and their dependencies
# (MongoDB, Redis, Floci AWS emulator) on a single shared network.
#
# Usage:
#   docker compose up --build -d            # plain run (production-style frontend, watch-capable backend image)
#   docker compose up --watch               # hot-reload: syncs source into the dev images
#   docker compose down -v
#
# With --watch:
#   - Backend runs `dotnet watch` inside the container; .cs/.json edits under
#     EprRegisterEnrolManagementBe/ are synced and trigger an in-process rebuild.
#     Edits to the .csproj or .sln rebuild the image.
#   - Frontend runs `nodemon` inside the container; edits under src/ are synced
#     and nodemon restarts the server. Edits to package*.json or vite.config.js
#     rebuild the image.
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8085

services:
  floci:
    image: hectorvent/floci:latest-aws
    restart: on-failure
    ports:
      - '4566:4566'
    env_file:
      - ./lib/epr-register-enrol-management-fe/compose/aws.env
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      AWS_ENDPOINT_URL: http://floci:4566
    volumes:
      - ./lib/epr-register-enrol-management-fe/compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant


  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./lib/epr-register-enrol-management-fe/compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  case-management-backend:
    build:
      context: ./lib/epr-register-enrol-management-be
      target: development
    container_name: case-management-backend
    ports:
      - '8085:8085'
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - ./lib/epr-register-enrol-management-be/compose/aws.env
    environment:
      ASPNETCORE_URLS: http://+:8085
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      Mongo__DatabaseName: epr-register-case-management
      WorkItems__SeedOnStartup: "true"
      NOTIFY_API_KEY: ${NOTIFY_API_KEY}
      Notify__RegulatorMailboxes__England: regulator-england@example.test
      OPERATOR_SERVICE_BASE_URL: http://localhost:3000
      OperatorBackendApi__Enabled: "true"
      OperatorBackendApi__URL: "http://epr-register-enrol-backend:8080"
      OPERATOR_BACKEND_SHARED_SECRET: "local-dev-secret"
      
      
    networks:
      - cdp-tenant
    develop:
      watch:
        - action: sync
          path: ./lib/epr-register-enrol-management-be/EprRegisterEnrolManagementBe
          target: /src/EprRegisterEnrolManagementBe
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./lib/epr-register-enrol-management-be/EprRegisterEnrolManagementBe/EprRegisterEnrolManagementBe.csproj
        - action: rebuild
          path: ./lib/epr-register-enrol-management-be/EprRegisterEnrolManagementBe.sln

  case-management-frontend:
    build:
      context: ./lib/epr-register-enrol-management-fe
      target: development
    container_name: case-management-frontend
    ports:
      - '5001:5000'
      - '127.0.0.1:9229:9229'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      case-management-backend:
        condition: service_started
    env_file:
      - ./lib/epr-register-enrol-management-fe/compose/aws.env
    environment:
      PORT: 5000
      NODE_ENV: development
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      SESSION_CACHE_NAME: case-mgmt-session
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      BACKEND_API_URL: http://case-management-backend:8085
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID_CASE_MANAGEMENT}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET_CASE_MANAGEMENT}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID_CASE_MANAGEMENT}
      # Fall back to the app's own convict defaults (config.js) when unset in
      # .env — Compose sets the var to an EMPTY STRING otherwise (not
      # "unset"), which silently overrides the app default and breaks the
      # real Entra ID role check for every local dev who hasn't customised
      # these two vars.
      ENTRA_REGULATOR_ROLE_VALUE: ${ENTRA_REGULATOR_ROLE_VALUE_CASE_MANAGEMENT:-Waste.Regulator.Standard}
      ENTRA_SUPPORT_USER_ROLE_VALUE: ${ENTRA_SUPPORT_USER_ROLE_VALUE_CASE_MANAGEMENT:-Waste.SupportUser.ReadOnly}
      AUTH_STUB_ENABLED: true
      AUTH_CALLBACK_BASE_URL: http://localhost:5001
    networks:
      - cdp-tenant
    develop:
      watch:
        - action: sync
          path: ./lib/epr-register-enrol-management-fe/src
          target: /home/node/src
          ignore:
            - node_modules/
        - action: sync
          path: ./lib/epr-register-enrol-management-fe/test-helpers
          target: /home/node/test-helpers
        - action: rebuild
          path: ./lib/epr-register-enrol-management-fe/package.json
        - action: rebuild
          path: ./lib/epr-register-enrol-management-fe/package-lock.json
        - action: rebuild
          path: ./lib/epr-register-enrol-management-fe/vite.config.js



  epr-register-enrol-backend:
#    image: defradigital/epr-register-enrol-backend:${EPR_REGISTER_ENROL_BACKEND:-latest}
    build:
      context: ./lib/epr-register-enrol-backend/
      target: development
    platform: linux/amd64
    links:
    - 'floci:floci'
    - 'mongodb:mongodb'
    environment:
      PORT: 8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      LOCALSTACK_ENDPOINT: 'http://floci:4566'
      Mongo__DatabaseUri: 'mongodb://mongodb:27017/'
      Mongo__DatabaseName: epr
      ASPNETCORE_ENVIRONMENT: Development
      CdpUploader__Url: http://cdp-uploader:7337
      App__BaseUrl: http://epr-register-enrol-backend:8080
      CaseWorking__Url: http://case-management-backend:8085
      CaseWorking__UseStub: "false"
      ReExApi__BaseUrl: ""
      REEX_API_BASIC_AUTH_USERNAME: ""
      REEX_API_BASIC_AUTH_PASSWORD: ""
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      cdp-uploader:
        condition: service_started
    ports:
      - 8080:8080
    healthcheck:
      test: ['CMD', 'curl', 'http://epr-register-enrol-backend:8080/health']
      interval: 3s
      start_period: 30s
      retries: 3
    networks:
      - cdp-tenant
    develop:
      watch:
        - action: sync
          path: ./lib/epr-register-enrol-backend/EprRegisterEnrolBackend
          target: /src/EprRegisterEnrolBackend
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./lib/epr-register-enrol-backend/EprRegisterEnrolBackend/EprRegisterEnrolBackend.csproj
        - action: rebuild
          path: ./lib/epr-register-enrol-backend/EprRegisterEnrolBackend.sln

  epr-register-enrol-frontend:
    # image: defradigital/epr-register-enrol-frontend:${EPR_REGISTER_ENROL_FRONTEND:-latest}
    platform: linux/amd64
    build:
      context: ./lib/epr-register-enrol-frontend/
      target: development
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
      - 'epr-register-enrol-backend:epr-register-enrol-backend'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      epr-register-enrol-backend:
        condition: service_healthy
    env_file:
      - './lib/epr-register-enrol-frontend/compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      LOCALSTACK_ENDPOINT: http://floci:4566
      SESSION_CACHE_NAME: operator-session
      USE_SINGLE_INSTANCE_CACHE: true
      API_BASE_URL: http://epr-register-enrol-backend:8080
      API_STUB_ENABLED: false
      REGULATOR_QUERY_TEXT_DISABLED: true
      API_TIMEOUT: 5000
      ASPNETCORE_ENVIRONMENT: Development
      CDP_UPLOADER_URL: http://cdp-uploader:7337
      CDP_UPLOADER_STUB_ENABLED: false
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID_FRONTEND}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET_FRONTEND}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID_FRONTEND}
      AUTH_STUB_ENABLED: true
      AUTH_CALLBACK_BASE_URL: http://localhost:3000
      DEFRA_ID_CLIENT_ID: ${DEFRA_ID_CLIENT_ID}
      DEFRA_ID_CLIENT_SECRET: ${DEFRA_ID_CLIENT_SECRET}
      DEFRA_ID_DISCOVERY_URL: ${DEFRA_ID_DISCOVERY_URL}
      DEFRA_ID_SERVICE_ID: ${DEFRA_ID_SERVICE_ID}

    networks:
      - cdp-tenant
    develop:
      watch:
        - action: sync
          path: ./lib/epr-register-enrol-frontend/src
          target: /home/node/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./lib/epr-register-enrol-frontend/package.json
        - action: rebuild
          path: ./lib/epr-register-enrol-frontend/package-lock.json
        - action: rebuild
          path: ./lib/epr-register-enrol-frontend/webpack.config.js


################################################################################
# Journey test services (opt-in: docker compose --profile tests run --rm mgmt-tests)
#
# selenium-chrome provides a remote WebDriver endpoint; mgmt-tests runs the
# WDIO suite from epr-register-enrol-mgmt-tests against the already-running
# case-management-frontend container. Both services join cdp-tenant so they
# can reach the other services by container name.
#
# Usage:
#   docker compose up -d                            # start the stack
#   docker compose --profile tests run --rm mgmt-tests  # run tests once

  selenium-chrome:
    image: selenium/standalone-chrome:123.0
    networks:
      - cdp-tenant
    profiles:
      - tests

  mgmt-tests:
    build:
      context: ./lib/epr-register-enrol-mgmt-tests
    environment:
      BASE_URL: http://case-management-frontend:5000
      CHROMEDRIVER_URL: selenium-chrome
      CHROMEDRIVER_PORT: "4444"
    depends_on:
      case-management-frontend:
        condition: service_started
      selenium-chrome:
        condition: service_started
    networks:
      - cdp-tenant
    profiles:
      - tests

################################################################################

  cdp-uploader:
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-latest}
    platform: linux/amd64
    ports:
      - '7337:7337'
    depends_on:
      floci:
        condition: service_healthy
    links:
      - 'floci:localstack'
      - 'redis:redis'
    env_file:
      - './lib/epr-register-enrol-frontend/compose/aws.env'
    environment:
      PORT: 7337
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      MOCK_VIRUS_SCAN_ENABLED: true
      MOCK_VIRUS_RESULT_DELAY: 3
      SQS_ENDPOINT: http://floci:4566
      S3_ENDPOINT: http://floci:4566
      SQS_SCAN_RESULTS: http://localhost:4566/000000000000/cdp-clamav-results
      SQS_SCAN_RESULTS_CALLBACK: http://localhost:4566/000000000000/cdp-uploader-scan-results-callback.fifo
      SQS_DOWNLOAD_REQUESTS: http://localhost:4566/000000000000/cdp-uploader-download-requests
      SQS_MOCK_CLAMAV: http://localhost:4566/000000000000/mock-clamav
      CONSUMER_BUCKETS: epr-register-enrol-file-uploads,epr-register-enrol-sampling-plans,epr-register-enrol-bes-evidence
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
